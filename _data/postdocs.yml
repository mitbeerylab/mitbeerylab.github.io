- name: Shir Bar
  photo: Shir.jpg
  info: Postdoc
  website: https://shir3bar.github.io
  linkedin: https://www.linkedin.com/in/shir-bar/
  google_scholar: https://scholar.google.com/citations?user=HlpcLSsAAAAJ
  description: >
    Shir is a postdoctoral fellow supported by the VATAT Marine Sciences Fellowship. 
    She works at the interface of AI and ecology, studying how expert knowledge can be used more efficiently to build ecological datasets, 
    especially for rare and hard-to-observe phenomena.

- name: Jonathan Sauder
  photo: JonathanSauder.png
  info: Postdoc
  website: https://josauder.github.io/
  google_scholar: https://scholar.google.com/citations?user=P1YcQw4AAAAJ
  linkedin: https://www.linkedin.com/in/josauder/
  description: >
    Jonathan is a postdoctoral fellow supported by the Swiss National Science Foundation. His work focuses on scaling up ecological monitoring in challenging environments such as underwater ecosystems. He is also interested in uses of real-time 3D computer vision for rapid habitat mapping and studying animal behavior from video.

- name: Burak Ekim
  photo: burak.jpg
  info: Postdoc
  website: https://burakekim.github.io/
  google_scholar: https://scholar.google.com/citations?user=fv_5G_4AAAAJ&hl=en
  linkedin: https://www.linkedin.com/in/burakekim
  description: >
    Burak is a postdoctoral associate specializing in the design and deployment of trustworthy, robust machine learning methods for climate, sustainability, and ecology. His work focuses on building diagnostic tools for domain shifts in large-scale deployments and driving scientific discovery to uncover novel ecological insights.

- name: Sam Lapp
  photo: sam_lapp.jpg
  info: Postdoc
  website: https://samlapp.com 
  google_scholar: https://scholar.google.com/citations?user=X5ubHcoAAAAJ&hl=en&oi=ao
  github: https://github.com/sammlapp
  description: >
    Sam is a postdoctoral research fellow at ESIIL, CU Boulder, where he is co-advised by Dr. Esther Rolf and Dr. Sara Beery. His current research projects focus on training machine learning models to extract rich insights from airborne LiDAR, providing user-friendly tools for analyzing passive acoustic monitoring datasets, and developing automated methods for individual identification of birds by their vocal signatures. He leads the development of Dipper, a desktop tool for passive acoustic monitoring analysis, and OpenSoundscape, an open-source Python package for bioacoustics analysis. He works closely with ecologists and conservation practitioners to apply these approaches to real-world data, enabling large-scale investigation of ecological processes and supporting conservation decision-making.



